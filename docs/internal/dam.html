<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAM · Asset Library</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .dam-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ── Header ── */
        .dam-header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 1.5rem;
            flex-shrink: 0;
        }
        .dam-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .dam-header-left { display: flex; align-items: center; gap: 0.75rem; }
        .dam-back { font-size: 13px; color: #64748b; text-decoration: none; }
        .dam-back:hover { color: #1d4ed8; text-decoration: underline; }
        .dam-sep { color: #cbd5e1; }
        .dam-header-title { font-size: 1rem; font-weight: 700; color: #1e293b; }

        .dam-account-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.625rem;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .dam-account-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
        }

        /* Search */
        .dam-search {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.35rem 0.75rem;
            min-width: 220px;
        }
        .dam-search input {
            border: none;
            background: none;
            outline: none;
            font-family: inherit;
            font-size: 0.85rem;
            color: #1e293b;
            width: 100%;
        }
        .dam-search input::placeholder { color: #94a3b8; }
        .dam-search-icon { color: #94a3b8; font-size: 13px; }

        /* Upload btn */
        .dam-upload-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.875rem;
            background: #1e293b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .dam-upload-btn:hover { background: #0f172a; }
        /* ── User menu ── */
        .u-menu { position: relative; margin-left: 0.5rem; }
        .u-avatar-btn { width: 32px; height: 32px; border-radius: 50%; background: #334155; color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
        .u-avatar-btn:hover { background: #475569; }
        .u-dropdown { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 200; padding: 0.375rem 0; }
        .u-drop-email { padding: 0.5rem 0.875rem; font-size: 0.78rem; color: #64748b; border-bottom: 1px solid #f1f5f9; margin-bottom: 0.25rem; }
        .u-drop-role { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; margin-top: 0.25rem; text-transform: uppercase; }
        .u-drop-role[data-role="owner"] { background: #ede9fe; color: #7c3aed; }
        .u-drop-role[data-role="admin"] { background: #dbeafe; color: #2563eb; }
        .u-drop-item { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0.5rem 0.875rem; font-size: 0.84rem; color: #374151; font-family: inherit; cursor: pointer; }
        .u-drop-item:hover { background: #f8fafc; }
        .u-drop-item--danger { color: #ef4444; }
        .u-drop-item--danger:hover { background: #fef2f2; }
        .adm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .adm-overlay.open { display: flex; }
        .adm-box { background: #fff; border-radius: 12px; width: 640px; max-width: 95vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .adm-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
        .adm-head-title { font-size: 1rem; font-weight: 700; }
        .adm-close { background: none; border: none; cursor: pointer; font-size: 16px; color: #94a3b8; }
        .adm-tabs { display: flex; border-bottom: 1px solid #e2e8f0; padding: 0 1.25rem; flex-shrink: 0; }
        .adm-tab { padding: 0.6rem 0.875rem; font-size: 0.84rem; font-weight: 600; border: none; background: none; cursor: pointer; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
        .adm-tab.active { color: #1e293b; border-bottom-color: #1e293b; }
        .adm-body { overflow-y: auto; padding: 1rem 1.25rem; flex: 1; }
        .adm-row { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; gap: 0.75rem; }
        .adm-row:last-child { border-bottom: none; }
        .adm-email { font-size: 0.85rem; color: #1e293b; }
        .adm-role-tag { font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.4rem; }
        .adm-role-tag[data-role="owner"] { background: #ede9fe; color: #7c3aed; }
        .adm-role-tag[data-role="admin"] { background: #dbeafe; color: #2563eb; }
        .adm-role-tag[data-role="user"]  { background: #f1f5f9; color: #64748b; }
        .adm-status { font-size: 0.75rem; color: #94a3b8; }
        .adm-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .adm-btn-approve { padding: 0.22rem 0.7rem; background: #1e293b; color: #fff; border: none; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; font-weight: 600; }
        .adm-btn-reject { padding: 0.22rem 0.7rem; background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; font-weight: 600; }
        .adm-empty { text-align: center; padding: 2rem; color: #94a3b8; font-size: 0.875rem; }

        /* ── Body ── */
        .dam-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── Sidebar ── */
        .dam-sidebar {
            width: 220px;
            flex-shrink: 0;
            border-right: 1px solid #e2e8f0;
            background: #fff;
            padding: 1rem 0;
            overflow-y: auto;
        }
        .dam-sidebar-label {
            padding: 0 1rem 0.4rem;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
        }
        .dam-folder {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            font-size: 0.875rem;
            color: #475569;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.1s;
        }
        .dam-folder:hover { background: #f8fafc; }
        .dam-folder.active {
            background: #eff6ff;
            color: #1d4ed8;
            border-left-color: #1d4ed8;
            font-weight: 600;
        }
        .dam-folder-icon { font-size: 15px; }
        .dam-folder-count {
            margin-left: auto;
            font-size: 11px;
            background: #f1f5f9;
            color: #64748b;
            padding: 1px 6px;
            border-radius: 10px;
        }
        .dam-folder.active .dam-folder-count {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* ── Main ── */
        .dam-main {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.5rem;
        }

        .dam-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 1.25rem;
        }
        .dam-breadcrumb a { color: #1d4ed8; text-decoration: none; }
        .dam-breadcrumb a:hover { text-decoration: underline; }
        .dam-breadcrumb-sep { color: #cbd5e1; }

        .dam-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .dam-count { font-size: 13px; color: #64748b; }
        .dam-view-btns { display: flex; gap: 0.25rem; }
        .dam-view-btn {
            padding: 0.3rem 0.5rem;
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #64748b;
        }
        .dam-view-btn.active { background: #1e293b; color: #fff; border-color: #1e293b; }

        /* Asset grid */
        .dam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .dam-asset {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .dam-asset:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .dam-asset-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f1f5f9;
        }
        .dam-asset-thumb img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }
        .dam-asset-info {
            padding: 0.625rem 0.75rem;
        }
        .dam-asset-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.3rem;
        }
        .dam-asset-meta {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .dam-asset-type {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 4px;
            background: #f1f5f9;
            color: #64748b;
        }
        .dam-asset-account {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            color: #fff;
        }

        /* Download button */
        .dam-asset-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0 0.75rem 0.625rem;
        }
        .dam-download-btn {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .dam-download-btn:hover { background: #e2e8f0; color: #1e293b; }

        /* Auth gate */
        .dam-gate {
            display: none;
            position: fixed;
            inset: 0;
            background: #f8fafc;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 999;
        }
        .dam-gate.visible { display: flex; }
        .dam-gate-icon { font-size: 2.5rem; }
        .dam-gate-title { font-size: 1.25rem; font-weight: 700; }
        .dam-gate-desc { font-size: 0.9rem; color: #64748b; }
        .dam-gate-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1.25rem;
            background: #1e293b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="dam-page">

    <!-- Auth gate -->
    <div class="dam-gate" id="damGate">
        <div class="dam-gate-icon">🔒</div>
        <div class="dam-gate-title">Access Restricted</div>
        <div class="dam-gate-desc">This page is only available to admins and owners.</div>
        <a class="dam-gate-btn" href="/internal/pr-tool.html">← Back to PR Tool</a>
    </div>

    <!-- Header -->
    <header class="dam-header">
        <div class="dam-header-inner">
            <div class="dam-header-left">
                <a href="/internal/pr-tool.html" class="dam-back">← PR Tool</a>
                <span class="dam-sep">|</span>
                <span class="dam-header-title">🗂️ DAM · Asset Library</span>
                <span class="dam-account-pill" id="accountPill">
                    <span class="dam-account-dot"></span>
                    <span id="accountPillName">Yanzhiwang</span>
                </span>
            </div>
            <div class="dam-header-left" style="gap:0.75rem">
                <div class="dam-search">
                    <span class="dam-search-icon">🔍</span>
                    <input type="text" placeholder="Search assets…" />
                </div>
                <button class="dam-upload-btn" id="uploadBtn">＋ Upload</button>
                <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx" multiple style="display:none" />
                <div class="u-menu" id="uMenu" style="display:none">
                    <button class="u-avatar-btn" id="uAvatarBtn" title=""></button>
                    <div class="u-dropdown" id="uDropdown" style="display:none">
                        <div class="u-drop-email"><div id="uEmail">—</div><span class="u-drop-role" id="uRole"></span></div>
                        <button class="u-drop-item" id="uAdminBtn" style="display:none">Admin Panel</button>
                        <button class="u-drop-item u-drop-item--danger" id="uLogoutBtn">Log Out</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Body -->
    <div class="dam-body">

        <!-- Sidebar -->
        <nav class="dam-sidebar">
            <div class="dam-sidebar-label">Folders</div>
            <div class="dam-folder active" data-folder="logo">
                <span class="dam-folder-icon">📁</span>
                Logo
                <span class="dam-folder-count">2</span>
            </div>
        </nav>

        <!-- Main -->
        <main class="dam-main">
            <div class="dam-breadcrumb">
                <span>All Assets</span>
                <span class="dam-breadcrumb-sep">›</span>
                <span>Logo</span>
            </div>
            <div class="dam-toolbar">
                <span class="dam-count" id="assetCount">2 assets</span>
                <div class="dam-view-btns">
                    <button class="dam-view-btn active">⊞</button>
                    <button class="dam-view-btn">☰</button>
                </div>
            </div>
            <div class="dam-grid">
                <div class="dam-asset">
                    <a href="/dam/logo/aibao-logo.PNG" target="_blank" rel="noopener noreferrer">
                        <div class="dam-asset-thumb">
                            <img src="/dam/logo/aibao-logo.PNG" alt="AIBao Logo" />
                        </div>
                    </a>
                    <div class="dam-asset-info">
                        <div class="dam-asset-name">aibao-logo.PNG</div>
                        <div class="dam-asset-meta">
                            <span class="dam-asset-type">PNG</span>
                            <span class="dam-asset-account" style="background:#1d4ed8;">Yanzhiwang</span>
                        </div>
                    </div>
                    <div class="dam-asset-actions">
                        <a class="dam-download-btn" href="/dam/logo/aibao-logo.PNG" download="aibao-logo.PNG">⬇ Download</a>
                    </div>
                </div>
                <div class="dam-asset">
                    <a href="/dam/logo/embodyx-logo.PNG" target="_blank" rel="noopener noreferrer">
                        <div class="dam-asset-thumb">
                            <img src="/dam/logo/embodyx-logo.PNG" alt="EmbodyX Logo" />
                        </div>
                    </a>
                    <div class="dam-asset-info">
                        <div class="dam-asset-name">embodyx-logo.PNG</div>
                        <div class="dam-asset-meta">
                            <span class="dam-asset-type">PNG</span>
                            <span class="dam-asset-account" style="background:#7c3aed;">EmbodyX</span>
                        </div>
                    </div>
                    <div class="dam-asset-actions">
                        <a class="dam-download-btn" href="/dam/logo/embodyx-logo.PNG" download="embodyx-logo.PNG">⬇ Download</a>
                    </div>
                </div>
            </div>
        </main>

    </div>
</div>

<script>
    const API = 'https://conference-tracker-production.up.railway.app';
    const ACCOUNTS = {
        yanzhiwang: { name: 'Yanzhiwang', color: '#1d4ed8' },
        embodyx:    { name: 'EmbodyX',    color: '#7c3aed' },
    };

    async function checkAccess() {
        const token = localStorage.getItem('ct_token');
        if (!token) { showGate(); return; }
        try {
            const res = await fetch(API + '/api/auth/me', {
                headers: { Authorization: 'Bearer ' + token }
            });
            if (!res.ok) { showGate(); return; }
            const user = await res.json();
            if (user.role !== 'owner' && user.role !== 'admin') { showGate(); return; }
            initUserMenu(user);
        } catch { showGate(); return; }

        // Apply account context
        const accKey = localStorage.getItem('pr_account') || 'yanzhiwang';
        const acc = ACCOUNTS[accKey] || ACCOUNTS.yanzhiwang;
        document.getElementById('accountPillName').textContent = acc.name;
        document.getElementById('accountPill').style.background = acc.color;
    }

    function showGate() {
        document.getElementById('damGate').classList.add('visible');
    }

    checkAccess();

    // Upload
    document.getElementById('uploadBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        const grid = document.querySelector('.dam-grid');
        const accKey = localStorage.getItem('pr_account') || 'yanzhiwang';
        const acc = ACCOUNTS[accKey] || ACCOUNTS.yanzhiwang;

        files.forEach(file => {
            const url = URL.createObjectURL(file);
            const ext = file.name.split('.').pop().toUpperCase();
            const isImage = file.type.startsWith('image/');

            const card = document.createElement('div');
            card.className = 'dam-asset';
            card.innerHTML = `
                <a href="${url}" target="_blank" rel="noopener noreferrer">
                    <div class="dam-asset-thumb">
                        ${isImage ? `<img src="${url}" alt="${file.name}" />` : `<span style="font-size:2rem">📄</span>`}
                    </div>
                </a>
                <div class="dam-asset-info">
                    <div class="dam-asset-name">${file.name}</div>
                    <div class="dam-asset-meta">
                        <span class="dam-asset-type">${ext}</span>
                        <span class="dam-asset-account" style="background:${acc.color}">${acc.name}</span>
                    </div>
                </div>
                <div class="dam-asset-actions">
                    <a class="dam-download-btn" href="${url}" download="${file.name}">⬇ Download</a>
                </div>
            `;
            grid.appendChild(card);
        });

        // Update count
        const total = grid.querySelectorAll('.dam-asset').length;
        document.getElementById('assetCount').textContent = `${total} assets`;
        e.target.value = '';
    });

    // ── User Menu ────────────────────────────────────────────────────────────
    function initUserMenu(user) {
        const menu = document.getElementById('uMenu');
        const btn  = document.getElementById('uAvatarBtn');
        const drop = document.getElementById('uDropdown');
        document.getElementById('uEmail').textContent = user.email;
        const roleEl = document.getElementById('uRole');
        roleEl.textContent = user.role || 'user';
        roleEl.setAttribute('data-role', user.role || 'user');
        menu.style.display = '';
        btn.textContent = user.email[0].toUpperCase();
        btn.title = user.email;
        if (user.role === 'owner' || user.role === 'admin') document.getElementById('uAdminBtn').style.display = '';
        btn.addEventListener('click', e => { e.stopPropagation(); drop.style.display = drop.style.display === 'none' ? '' : 'none'; });
        document.addEventListener('click', () => { drop.style.display = 'none'; });
        document.getElementById('uAdminBtn').addEventListener('click', () => { drop.style.display = 'none'; openAdminPanel(); });
        document.getElementById('uLogoutBtn').addEventListener('click', () => { localStorage.removeItem('ct_token'); location.href = '/internal/conferences/'; });
    }

    // ── Admin Panel ──────────────────────────────────────────────────────────
    const damToken = () => localStorage.getItem('ct_token');
    let admTab = 'pending', admUsers = [], admPending = [];

    // Insert modal HTML
    const admEl = document.createElement('div');
    admEl.className = 'adm-overlay'; admEl.id = 'admOverlay';
    admEl.innerHTML = `<div class="adm-box"><div class="adm-head"><span class="adm-head-title">Admin Panel</span><button class="adm-close" id="admClose">✕</button></div><div class="adm-tabs"><button class="adm-tab active" id="admTabPending">Pending</button><button class="adm-tab" id="admTabUsers">All Users</button></div><div class="adm-body" id="admBody"></div></div>`;
    document.body.appendChild(admEl);

    document.getElementById('admClose').addEventListener('click', () => admEl.classList.remove('open'));
    admEl.addEventListener('click', e => { if (e.target === admEl) admEl.classList.remove('open'); });
    document.getElementById('admTabPending').addEventListener('click', () => { admTab = 'pending'; renderAdmTabs(); renderAdmBody(); });
    document.getElementById('admTabUsers').addEventListener('click', () => { admTab = 'users'; renderAdmTabs(); renderAdmBody(); });

    async function openAdminPanel() {
        admEl.classList.add('open');
        document.getElementById('admBody').innerHTML = '<div class="adm-empty">Loading…</div>';
        try {
            const t = damToken();
            const [ur, pr] = await Promise.all([
                fetch(API + '/api/admin/users',        { headers: { Authorization: 'Bearer ' + t } }),
                fetch(API + '/api/admin/pending-users', { headers: { Authorization: 'Bearer ' + t } }),
            ]);
            admUsers = ur.ok ? await ur.json() : [];
            admPending = pr.ok ? await pr.json() : [];
            document.getElementById('admTabPending').textContent = `Pending${admPending.length ? ' (' + admPending.length + ')' : ''}`;
            document.getElementById('admTabUsers').textContent = `All Users (${admUsers.length})`;
            renderAdmTabs(); renderAdmBody();
        } catch { document.getElementById('admBody').innerHTML = '<div class="adm-empty" style="color:#ef4444">Failed to load.</div>'; }
    }
    function renderAdmTabs() {
        document.getElementById('admTabPending').classList.toggle('active', admTab === 'pending');
        document.getElementById('admTabUsers').classList.toggle('active', admTab === 'users');
    }
    function renderAdmBody() {
        const body = document.getElementById('admBody');
        if (admTab === 'pending') {
            if (!admPending.length) { body.innerHTML = '<div class="adm-empty">No pending registrations.</div>'; return; }
            body.innerHTML = admPending.map(u => `<div class="adm-row"><span class="adm-email">${u.email}</span><div class="adm-actions"><button class="adm-btn-approve" onclick="admAction('${u.id}','approve')">Approve</button><button class="adm-btn-reject" onclick="admAction('${u.id}','reject')">Reject</button></div></div>`).join('');
        } else {
            body.innerHTML = admUsers.map(u => `<div class="adm-row"><div><span class="adm-email">${u.email}</span><span class="adm-role-tag" data-role="${u.role||'user'}">${u.role||'user'}</span></div><span class="adm-status">${u.status||'—'}</span></div>`).join('');
        }
    }
    async function admAction(id, action) {
        const t = damToken();
        const url = action === 'approve' ? `/api/admin/users/${id}/approve` : `/api/admin/users/${id}/reject`;
        await fetch(API + url, { method: 'PUT', headers: { Authorization: 'Bearer ' + t } });
        openAdminPanel();
    }
</script>
</body>
</html>
