<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

        /* ── Header ── */
        .pr-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 2rem; }
        .pr-header-inner { max-width: 1100px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 1rem; }
        .pr-back { font-size: 13px; color: #64748b; text-decoration: none; }
        .pr-back:hover { color: #1d4ed8; text-decoration: underline; }
        .pr-header-sep { color: #cbd5e1; }
        .pr-header-title { font-size: 1rem; font-weight: 700; color: #1e293b; }
        .pr-view-toggle { display: flex; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; margin-left: 0.25rem; }
        .pr-view-btn { padding: 0.3rem 0.875rem; font-size: 0.82rem; font-weight: 600; border: none; background: #f8fafc; color: #64748b; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; text-decoration: none; display: inline-block; line-height: 1.6; }
        .pr-view-btn + .pr-view-btn { border-left: 1px solid #e2e8f0; }
        .pr-view-btn.active { background: #1e293b; color: #fff; }
        .pr-view-btn:hover:not(.active) { background: #f1f5f9; }

        /* ── User menu ── */
        .u-menu { position: relative; margin-left: auto; }
        .u-avatar-btn { width: 32px; height: 32px; border-radius: 50%; background: #1e293b; color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
        .u-avatar-btn:hover { background: #334155; }
        .u-dropdown { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 200; padding: 0.375rem 0; }
        .u-drop-email { padding: 0.5rem 0.875rem; font-size: 0.78rem; color: #64748b; border-bottom: 1px solid #f1f5f9; margin-bottom: 0.25rem; }
        .u-drop-role { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; margin-top: 0.25rem; text-transform: uppercase; }
        .u-drop-role[data-role="owner"] { background: #ede9fe; color: #7c3aed; }
        .u-drop-role[data-role="admin"] { background: #dbeafe; color: #2563eb; }
        .u-drop-role[data-role="user"]  { background: #f1f5f9; color: #64748b; }
        .u-drop-item { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0.5rem 0.875rem; font-size: 0.84rem; color: #374151; font-family: inherit; cursor: pointer; }
        .u-drop-item:hover { background: #f8fafc; }
        .u-drop-item--danger { color: #ef4444; }
        .u-drop-item--danger:hover { background: #fef2f2; }
        .adm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .adm-overlay.open { display: flex; }
        .adm-box { background: #fff; border-radius: 12px; width: 640px; max-width: 95vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .adm-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
        .adm-head-title { font-size: 1rem; font-weight: 700; }
        .adm-close { background: none; border: none; cursor: pointer; font-size: 16px; color: #94a3b8; }
        .adm-tabs { display: flex; border-bottom: 1px solid #e2e8f0; padding: 0 1.25rem; flex-shrink: 0; }
        .adm-tab { padding: 0.6rem 0.875rem; font-size: 0.84rem; font-weight: 600; border: none; background: none; cursor: pointer; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
        .adm-tab.active { color: #1e293b; border-bottom-color: #1e293b; }
        .adm-body { overflow-y: auto; padding: 1rem 1.25rem; flex: 1; }
        .adm-row { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; gap: 0.75rem; }
        .adm-row:last-child { border-bottom: none; }
        .adm-email { font-size: 0.85rem; color: #1e293b; }
        .adm-role-tag { font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.4rem; }
        .adm-role-tag[data-role="owner"] { background: #ede9fe; color: #7c3aed; }
        .adm-role-tag[data-role="admin"] { background: #dbeafe; color: #2563eb; }
        .adm-role-tag[data-role="user"]  { background: #f1f5f9; color: #64748b; }
        .adm-status { font-size: 0.75rem; color: #94a3b8; flex-shrink: 0; }
        .adm-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .adm-btn-approve { padding: 0.22rem 0.7rem; background: #1e293b; color: #fff; border: none; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; font-weight: 600; }
        .adm-btn-approve:hover { background: #0f172a; }
        .adm-btn-reject { padding: 0.22rem 0.7rem; background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; font-weight: 600; }
        .adm-btn-reject:hover { background: #fef2f2; }
        .adm-empty { text-align: center; padding: 2rem; color: #94a3b8; font-size: 0.875rem; }

        /* ── Auth gate ── */
        .cp-gate { display: none; position: fixed; inset: 0; background: #f8fafc; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 999; }
        .cp-gate.visible { display: flex; }
        .cp-gate-icon { font-size: 2.5rem; }
        .cp-gate-title { font-size: 1.25rem; font-weight: 700; }
        .cp-gate-desc { font-size: 0.9rem; color: #64748b; }
        .cp-gate-btn { margin-top: 0.5rem; padding: 0.5rem 1.25rem; background: #1e293b; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; text-decoration: none; }

        /* ── Page body ── */
        .cp-body { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; display: flex; flex-direction: column; gap: 1.25rem; }

        /* ── Hero ── */
        .cp-hero { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .cp-hero-icon { font-size: 2rem; flex-shrink: 0; }
        .cp-hero-info { flex: 1; min-width: 0; }
        .cp-hero-name { font-size: 1.2rem; font-weight: 700; color: #0f172a; }
        .cp-hero-desc { font-size: 0.85rem; color: #64748b; margin-top: 0.15rem; }
        .cp-hero-link { font-size: 0.8rem; color: #1d4ed8; text-decoration: none; display: inline-block; margin-top: 0.25rem; }
        .cp-hero-link:hover { text-decoration: underline; }

        /* ── News-Management-style list ── */
        .pt-table { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #fff; }

        /* Filter bar (top of table) */
        .paper-filters { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; }
        .paper-filters select { padding: 0.4rem 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.875rem; background: #f8fafc; color: #1e293b; font-family: inherit; cursor: pointer; }

        /* Column header */
        .pt-header-row { display: flex; align-items: center; padding: 0.4rem 0.75rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .pt-row-title-header { flex: 1; }

        /* Data rows */
        .pt-row { display: flex; align-items: flex-start; padding: 0.6rem 0.75rem; border-bottom: 1px solid #f1f5f9; gap: 0; }
        .pt-row:last-child { border-bottom: none; }
        .pt-row:hover { background: #fafbfc; }

        /* Title cell */
        .pt-row-title { flex: 1; font-size: 0.8rem; color: #1e293b; padding-right: 0.75rem; min-width: 0; }
        .pt-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; margin-bottom: 0.25rem; }
        .pt-meta-platform { font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; }
        .pt-meta-date { font-size: 0.68rem; color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 3px; padding: 0 4px; }
        .pt-row-title-text { font-size: 0.82rem; font-weight: 600; color: #1e293b; line-height: 1.4; word-break: break-word; }
        .pt-title-link { color: inherit; text-decoration: underline; text-decoration-color: #94a3b8; text-underline-offset: 2px; }
        .pt-title-link:hover { color: #1d4ed8; text-decoration-color: #1d4ed8; }
        .pt-row-content { font-size: 0.72rem; color: #64748b; margin-top: 0.2rem; }

        /* Metrics chips */
        .pt-metrics-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
        .pt-metric-chip { font-size: 0.68rem; color: #475569; background: #f1f5f9; border-radius: 4px; padding: 0.1rem 0.45rem; }
        .pt-metric-chip strong { font-weight: 700; color: #1e293b; }

        /* Actions column */
        .pt-row-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; width: 80px; justify-content: flex-end; padding-top: 0.15rem; }
        .pt-delete-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; padding: 0.2rem 0.3rem; border-radius: 4px; line-height: 1; }
        .pt-delete-btn:hover { background: #fef2f2; color: #ef4444; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1rem; border-radius: 8px; font-family: inherit; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-size: 0.875rem; transition: all 0.15s; line-height: 1; }
        .btn--primary { background: #1e293b; color: #fff; border-color: #1e293b; }
        .btn--primary:hover { background: #0f172a; }
        .btn--secondary { background: #fff; color: #374151; border-color: #e2e8f0; }
        .btn--secondary:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn--danger { background: #fff; color: #ef4444; border-color: #fca5a5; margin-left: auto; }
        .btn--danger:hover { background: #fef2f2; }
        .btn--small { padding: 0.25rem 0.6rem; font-size: 0.8rem; border-radius: 6px; }

        /* Inline form */
        .paper-form { background: #fff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 1rem 0.75rem; }
        .paper-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .paper-form-grid label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; font-weight: 600; color: #64748b; }
        .paper-form-grid input, .paper-form-grid select { padding: 0.4rem 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.875rem; background: #f8fafc; color: #1e293b; font-family: inherit; }
        .paper-form-grid input:focus, .paper-form-grid select:focus { outline: none; border-color: #94a3b8; background: #fff; }
        .paper-form-metrics { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #f1f5f9; }
        .paper-form-metrics-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 0.5rem; }
        .paper-form-metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        .paper-form-metrics-grid label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; font-weight: 600; color: #64748b; }
        .paper-form-metrics-grid input { padding: 0.35rem 0.5rem; border: 1px solid #e2e8f0; border-radius: 5px; font-size: 0.82rem; background: #f8fafc; color: #1e293b; font-family: inherit; }
        .paper-form-actions { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }

        /* Empty / loading */
        .pt-empty { text-align: center; padding: 2.5rem; color: #94a3b8; font-size: 0.875rem; }
        .cp-loading { text-align: center; padding: 4rem; color: #94a3b8; font-size: 0.9rem; }

        @media (max-width: 700px) {
            .paper-form-grid { grid-template-columns: 1fr; }
            .paper-form-metrics-grid { grid-template-columns: 1fr 1fr; }
            .cp-body { padding: 1rem 1rem 4rem; }
            .pr-header { padding: 0 1rem; }
        }
    </style>
</head>
<body>

<div class="cp-gate" id="cpGate">
    <div class="cp-gate-icon">🔒</div>
    <div class="cp-gate-title">Access Restricted</div>
    <div class="cp-gate-desc">This page is only available to admins and owners.</div>
    <a class="cp-gate-btn" href="/internal/pr-tool.html">← PR Tool</a>
</div>

<header class="pr-header">
    <div class="pr-header-inner">
        <a href="/internal/pr-tool.html" class="pr-back">← PR Tool</a>
        <span class="pr-header-sep">|</span>
        <span class="pr-header-title" id="headerTitle">Campaign</span>
        <div class="pr-view-toggle">
            <span class="pr-view-btn active">Posts</span>
            <a class="pr-view-btn" id="prMatrixLink" href="/internal/pr-tool.html?filter=product" target="_blank" rel="noopener noreferrer">PR Matrix</a>
        </div>
        <div class="u-menu" id="uMenu" style="display:none">
            <button class="u-avatar-btn" id="uAvatarBtn" title=""></button>
            <div class="u-dropdown" id="uDropdown" style="display:none">
                <div class="u-drop-email">
                    <div id="uEmail">—</div>
                    <span class="u-drop-role" id="uRole"></span>
                </div>
                <button class="u-drop-item" id="uAdminBtn" style="display:none">Admin Panel</button>
                <button class="u-drop-item u-drop-item--danger" id="uLogoutBtn">Log Out</button>
            </div>
        </div>
    </div>
</header>

<div class="adm-overlay" id="admOverlay">
    <div class="adm-box">
        <div class="adm-head"><span class="adm-head-title">Admin Panel</span><button class="adm-close" id="admClose">✕</button></div>
        <div class="adm-tabs">
            <button class="adm-tab active" data-adm-tab="pending" id="admTabPending">Pending</button>
            <button class="adm-tab" data-adm-tab="users" id="admTabUsers">All Users</button>
        </div>
        <div class="adm-body" id="admBody"></div>
    </div>
</div>

<div class="cp-body" id="cpBody" style="display:none">

    <!-- Hero: product info -->
    <div class="cp-hero">
        <div class="cp-hero-icon" id="heroIcon">📦</div>
        <div class="cp-hero-info">
            <div class="cp-hero-name" id="heroName">Loading…</div>
            <div class="cp-hero-desc" id="heroDesc"></div>
            <a class="cp-hero-link" id="heroLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none">↗ Visit Link</a>
        </div>
    </div>

    <!-- Post list (News Management style) -->
    <div class="pt-table">
        <div class="paper-filters">
            <select id="filterPlatform">
                <option value="all">All Platforms</option>
                <option value="linkedin">LinkedIn</option>
                <option value="x">X (Twitter)</option>
                <option value="rednote">Rednote</option>
                <option value="wechat">WeChat</option>
            </select>
            <button class="btn btn--primary btn--small" id="addPostBtn">+ Log Post</button>
        </div>
        <div class="pt-header-row">
            <div class="pt-row-title-header">Posts</div>
            <div style="width:80px"></div>
        </div>
        <div id="postList"><div class="cp-loading">Loading…</div></div>
    </div>

</div>

<script>
const API = 'https://conference-tracker-production.up.railway.app';

const PLATFORMS = [
    { key: 'linkedin', label: 'LinkedIn', color: '#0A66C2', bg: '#dbeafe', metrics: ['views','likes','comments','reposts'] },
    { key: 'x',        label: 'X',        color: '#1e293b', bg: '#f1f5f9', metrics: ['views','likes','reposts'] },
    { key: 'rednote',  label: 'Rednote',  color: '#FF2442', bg: '#fee2e2', metrics: ['views','likes','saves','comments'] },
    { key: 'wechat',   label: 'WeChat',   color: '#07C160', bg: '#dcfce7', metrics: ['reads','likes'] },
];
const PLAT_MAP = Object.fromEntries(PLATFORMS.map(p => [p.key, p]));

let token = null, source = null;
let filterPlatform = 'all';
let showAdd = false;
let editingPostId = null;

// ── Auth ───────────────────────────────────────────────────────────────────────
async function init() {
    token = localStorage.getItem('ct_token');
    if (!token) { showGate(); return; }
    try {
        const res = await fetch(API + '/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) { showGate(); return; }
        const user = await res.json();
        if (user.role !== 'owner' && user.role !== 'admin') { showGate(); return; }
        initUserMenu(user);
    } catch { showGate(); return; }
    loadSource();
}

function showGate() { document.getElementById('cpGate').classList.add('visible'); }

// ── Load ───────────────────────────────────────────────────────────────────────
async function loadSource() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) {
        document.getElementById('postList').innerHTML = '<div class="cp-loading">No product ID specified.</div>';
        document.getElementById('cpBody').style.display = '';
        return;
    }
    try {
        const res = await fetch(API + '/api/pr-sources', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) throw new Error();
        const all = await res.json();
        source = all.find(s => s.id === id);
        if (!source) throw new Error('not found');
    } catch {
        document.getElementById('postList').innerHTML = '<div class="cp-loading">Failed to load product.</div>';
        document.getElementById('cpBody').style.display = '';
        return;
    }
    document.getElementById('cpBody').style.display = '';
    renderHero();
    renderPostList();
}

// ── Hero ───────────────────────────────────────────────────────────────────────
function renderHero() {
    document.title = source.title + ' — Posts';
    document.getElementById('headerTitle').textContent = source.title;
    document.getElementById('heroIcon').textContent = source.icon || '📦';
    document.getElementById('heroName').textContent = source.title;
    document.getElementById('heroDesc').textContent = source.description || '';
    if (source.link) {
        const lnk = document.getElementById('heroLink');
        lnk.href = source.link;
        lnk.style.display = '';
    }
}

// ── Render post list ───────────────────────────────────────────────────────────
function renderPostList() {
    const posts = [...(source.posts || [])]
        .filter(p => filterPlatform === 'all' || p.platform === filterPlatform)
        .sort((a, b) => b.date.localeCompare(a.date));

    let html = '';

    // Inline add form at top
    if (showAdd && !editingPostId) {
        html += renderPostForm(null);
    }

    if (posts.length === 0 && !showAdd) {
        html += '<div class="pt-empty">No posts logged yet. Click "+ Log Post" to get started.</div>';
    } else {
        html += posts.map(p =>
            editingPostId === p.id ? renderPostForm(p) : renderPostRow(p)
        ).join('');
    }

    document.getElementById('postList').innerHTML = html;
    wirePostListEvents();
}

function renderPostRow(p) {
    const plat = PLAT_MAP[p.platform] || { key: p.platform, label: p.platform, color: '#64748b', bg: '#f1f5f9', metrics: [] };
    const metrics = plat.metrics.filter(m => p.metrics?.[m] != null && p.metrics[m] !== '');
    const metricsHtml = metrics.length
        ? `<div class="pt-metrics-row">${metrics.map(m =>
            `<span class="pt-metric-chip"><strong>${fmtNum(p.metrics[m])}</strong> ${m}</span>`
          ).join('')}</div>`
        : '';

    // Title: show content as title if set; URL as link line; fallback "No link"
    let titleHtml;
    if (p.content) {
        titleHtml = esc(p.content);
    } else if (p.url) {
        titleHtml = `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" class="pt-title-link">${esc(p.url)}</a>`;
    } else {
        titleHtml = `<span style="color:#94a3b8;font-style:italic">No link</span>`;
    }

    const urlLine = (p.content && p.url)
        ? `<div class="pt-row-content"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" class="pt-title-link" style="font-size:0.72rem">${esc(p.url)}</a></div>`
        : '';

    return `<div class="pt-row">
        <div class="pt-row-title">
            <div class="pt-row-meta">
                <span class="pt-meta-platform" style="color:${plat.color};background:${plat.bg}">${plat.label}</span>
                <span class="pt-meta-date">${p.date}</span>
            </div>
            <div class="pt-row-title-text">${titleHtml}</div>
            ${urlLine}
            ${metricsHtml}
        </div>
        <div class="pt-row-actions">
            <button class="btn btn--small btn--secondary" data-edit-post="${esc(p.id)}">Edit</button>
            <button class="pt-delete-btn" data-del-post="${esc(p.id)}" title="Delete">✕</button>
        </div>
    </div>`;
}

function renderPostForm(p) {
    const currentPlat = PLAT_MAP[p?.platform || 'linkedin'] || { metrics: [] };
    const platformOptions = PLATFORMS.map(pl =>
        `<option value="${pl.key}"${(p?.platform || 'linkedin') === pl.key ? ' selected' : ''}>${pl.label}</option>`
    ).join('');
    const metricsHtml = currentPlat.metrics.map(m =>
        `<label>${capitalize(m)}<input type="number" min="0" id="fm_${m}" placeholder="0" value="${p?.metrics?.[m] ?? ''}" /></label>`
    ).join('');

    return `<div class="paper-form" id="postForm">
        <div class="paper-form-grid">
            <label>Platform
                <select id="fm_platform">${platformOptions}</select>
            </label>
            <label>Date
                <input type="date" id="fm_date" value="${p?.date || new Date().toISOString().slice(0, 10)}" />
            </label>
            <label style="grid-column:1/-1">Content / Caption
                <input type="text" id="fm_content" value="${esc(p?.content || '')}" placeholder="Post description or caption (optional)" />
            </label>
            <label style="grid-column:1/-1">Post URL
                <input type="url" id="fm_url" value="${esc(p?.url || '')}" placeholder="https://…" />
            </label>
        </div>
        <div class="paper-form-metrics">
            <div class="paper-form-metrics-label">Metrics (optional)</div>
            <div class="paper-form-metrics-grid" id="fm_metrics_grid">${metricsHtml}</div>
        </div>
        <div class="paper-form-actions">
            <button class="btn btn--primary btn--small" id="fm_save">Save</button>
            <button class="btn btn--secondary btn--small" id="fm_cancel">Cancel</button>
            ${p ? `<button class="btn btn--small btn--danger" id="fm_delete">Delete</button>` : ''}
        </div>
    </div>`;
}

function wirePostListEvents() {
    // Platform change → refresh metrics fields
    document.getElementById('fm_platform')?.addEventListener('change', function () {
        const plat = PLAT_MAP[this.value] || { metrics: [] };
        document.getElementById('fm_metrics_grid').innerHTML = plat.metrics.map(m =>
            `<label>${capitalize(m)}<input type="number" min="0" id="fm_${m}" placeholder="0" /></label>`
        ).join('');
    });

    document.getElementById('fm_save')?.addEventListener('click', savePost);
    document.getElementById('fm_cancel')?.addEventListener('click', () => {
        showAdd = false; editingPostId = null; renderPostList();
    });
    document.getElementById('fm_delete')?.addEventListener('click', async () => {
        if (!editingPostId || !confirm('Delete this post?')) return;
        const posts = (source.posts || []).filter(p => p.id !== editingPostId);
        editingPostId = null; showAdd = false;
        await savePosts(posts);
    });

    document.querySelectorAll('[data-edit-post]').forEach(btn =>
        btn.addEventListener('click', () => {
            editingPostId = btn.dataset.editPost;
            showAdd = false;
            renderPostList();
        })
    );
    document.querySelectorAll('[data-del-post]').forEach(btn =>
        btn.addEventListener('click', async () => {
            if (!confirm('Delete this post?')) return;
            const posts = (source.posts || []).filter(p => p.id !== btn.dataset.delPost);
            await savePosts(posts);
        })
    );
}

// ── Save ───────────────────────────────────────────────────────────────────────
async function savePost() {
    const platform = document.getElementById('fm_platform').value;
    const date     = document.getElementById('fm_date').value;
    if (!date) { alert('Date is required.'); return; }
    const content = document.getElementById('fm_content').value.trim();
    const url     = document.getElementById('fm_url').value.trim();

    const plat = PLAT_MAP[platform] || { metrics: [] };
    const metrics = {};
    plat.metrics.forEach(m => {
        const el = document.getElementById('fm_' + m);
        const v = el ? el.value.trim() : '';
        if (v !== '') metrics[m] = Number(v);
    });

    const posts = [...(source.posts || [])];
    if (editingPostId) {
        const idx = posts.findIndex(p => p.id === editingPostId);
        if (idx !== -1) posts[idx] = { ...posts[idx], platform, date, content, url, metrics };
    } else {
        posts.push({ id: 'post_' + Date.now(), platform, date, content, url, metrics });
    }

    showAdd = false; editingPostId = null;
    await savePosts(posts);
}

async function savePosts(posts) {
    try {
        const res = await fetch(`${API}/api/pr-sources/${source.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ ...source, posts }),
        });
        if (!res.ok) throw new Error();
        source.posts = posts;
        renderPostList();
    } catch { alert('Failed to save post.'); }
}

// ── Filter + Add ───────────────────────────────────────────────────────────────
document.getElementById('filterPlatform').addEventListener('change', function () {
    filterPlatform = this.value;
    renderPostList();
});

document.getElementById('addPostBtn').addEventListener('click', () => {
    showAdd = true; editingPostId = null; renderPostList();
});

// ── Utils ──────────────────────────────────────────────────────────────────────
function fmtNum(n) {
    if (n == null) return '—';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();

// ── User Menu ─────────────────────────────────────────────────────────────────
function initUserMenu(user) {
    const menu = document.getElementById('uMenu');
    const btn  = document.getElementById('uAvatarBtn');
    const drop = document.getElementById('uDropdown');
    document.getElementById('uEmail').textContent = user.email;
    const roleEl = document.getElementById('uRole');
    roleEl.textContent = user.role || 'user';
    roleEl.setAttribute('data-role', user.role || 'user');
    menu.style.display = '';
    btn.textContent = user.email[0].toUpperCase();
    btn.title = user.email;
    if (user.role === 'owner' || user.role === 'admin') document.getElementById('uAdminBtn').style.display = '';
    btn.addEventListener('click', e => { e.stopPropagation(); drop.style.display = drop.style.display === 'none' ? '' : 'none'; });
    document.addEventListener('click', () => { drop.style.display = 'none'; });
    document.getElementById('uAdminBtn').addEventListener('click', () => { drop.style.display = 'none'; openAdminPanel(); });
    document.getElementById('uLogoutBtn').addEventListener('click', () => { localStorage.removeItem('ct_token'); location.href = '/internal/conferences/'; });
}

let admTab = 'pending', admUsers = [], admPending = [];
document.getElementById('admClose').addEventListener('click', () => document.getElementById('admOverlay').classList.remove('open'));
document.getElementById('admOverlay').addEventListener('click', e => { if (e.target === document.getElementById('admOverlay')) document.getElementById('admOverlay').classList.remove('open'); });
document.getElementById('admTabPending').addEventListener('click', () => { admTab = 'pending'; renderAdmTabs(); renderAdmBody(); });
document.getElementById('admTabUsers').addEventListener('click', () => { admTab = 'users'; renderAdmTabs(); renderAdmBody(); });

async function openAdminPanel() {
    document.getElementById('admOverlay').classList.add('open');
    document.getElementById('admBody').innerHTML = '<div class="adm-empty">Loading…</div>';
    try {
        const [ur, pr] = await Promise.all([
            fetch(API + '/api/admin/users',        { headers: { Authorization: 'Bearer ' + token } }),
            fetch(API + '/api/admin/pending-users', { headers: { Authorization: 'Bearer ' + token } }),
        ]);
        admUsers = ur.ok ? await ur.json() : [];
        admPending = pr.ok ? await pr.json() : [];
        document.getElementById('admTabPending').textContent = `Pending${admPending.length ? ' (' + admPending.length + ')' : ''}`;
        document.getElementById('admTabUsers').textContent = `All Users (${admUsers.length})`;
        renderAdmTabs(); renderAdmBody();
    } catch { document.getElementById('admBody').innerHTML = '<div class="adm-empty" style="color:#ef4444">Failed to load.</div>'; }
}
function renderAdmTabs() {
    document.getElementById('admTabPending').classList.toggle('active', admTab === 'pending');
    document.getElementById('admTabUsers').classList.toggle('active', admTab === 'users');
}
function renderAdmBody() {
    const body = document.getElementById('admBody');
    if (admTab === 'pending') {
        if (!admPending.length) { body.innerHTML = '<div class="adm-empty">No pending registrations.</div>'; return; }
        body.innerHTML = admPending.map(u => `<div class="adm-row"><span class="adm-email">${u.email}</span><div class="adm-actions"><button class="adm-btn-approve" onclick="admAction('${u.id}','approve')">Approve</button><button class="adm-btn-reject" onclick="admAction('${u.id}','reject')">Reject</button></div></div>`).join('');
    } else {
        body.innerHTML = admUsers.map(u => `<div class="adm-row"><div><span class="adm-email">${u.email}</span><span class="adm-role-tag" data-role="${u.role||'user'}">${u.role||'user'}</span></div><span class="adm-status">${u.status||'—'}</span></div>`).join('');
    }
}
async function admAction(id, action) {
    const url = action === 'approve' ? `/api/admin/users/${id}/approve` : `/api/admin/users/${id}/reject`;
    await fetch(API + url, { method: 'PUT', headers: { Authorization: 'Bearer ' + token } });
    openAdminPanel();
}
</script>
