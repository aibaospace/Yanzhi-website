,[446,47],[450,61]],"label":[457.7,44.1]}];
        const stateAliases = Object.fromEntries(stateShapes.flatMap(({ abbr, name }) => [[abbr.toLowerCase(), abbr], [name.toLowerCase(), abbr]]));
        const stateOptions = [...new Map(stateShapes.map(({ abbr, name }) => [abbr, name])).entries()]
            .sort(([abbrA], [abbrB]) => abbrA.localeCompare(abbrB));
        const stateLabelOverrides = {
            VT: [430, 27], NH: [464, 28], MA: [488, 58], RI: [489, 84], CT: [488, 108], NJ: [488, 130], DE: [488, 154], MD: [488, 178], DC: [488, 204]
        };
        let pageOffset = Number(sessionStorage.getItem('activity_arrangement_page_offset') || 0);
        let scheduleCache = readLocalSchedule();
        let saveTimer = null;
        let activeTooltipEntries = new Map();

        function normalizeSchedule(schedule) {
            return {
                cells: schedule?.cells && typeof schedule.cells === 'object' ? schedule.cells : {},
                states: schedule?.states && typeof schedule.states === 'object' ? schedule.states : {},
                companies: schedule?.companies && typeof schedule.companies === 'object' ? schedule.companies : {},
                companyLocations: schedule?.companyLocations && typeof schedule.companyLocations === 'object' ? schedule.companyLocations : {},
                updatedAt: schedule?.updatedAt || null
            };
        }

        function hasScheduleEntries(schedule) {
            return Object.values(schedule.cells || {}).some((value) => String(value || '').trim()) ||
                Object.values(schedule.states || {}).some(Boolean) ||
                Object.values(schedule.companies || {}).some((value) => String(value || '').trim()) ||
                Object.values(schedule.companyLocations || {}).some((value) => String(value || '').trim());
        }

        function mergeSchedules(remoteSchedule, localSchedule) {
            const remote = normalizeSchedule(remoteSchedule);
            const local = normalizeSchedule(localSchedule);
            return {
                cells: { ...local.cells, ...remote.cells },
                states: { ...local.states, ...remote.states },
                companies: { ...local.companies, ...remote.companies },
                companyLocations: { ...local.companyLocations, ...remote.companyLocations },
                updatedAt: remote.updatedAt || local.updatedAt || null
            };
        }

        function readLocalSchedule() {
            try {
                return normalizeSchedule(JSON.parse(localStorage.getItem(storageKey)));
            } catch {}
            return normalizeSchedule();
        }

        function persistLocalSchedule(schedule) {
            localStorage.setItem(storageKey, JSON.stringify(normalizeSchedule(schedule)));
        }

        function getAuthToken() {
            return localStorage.getItem(tokenKey);
        }

        function setSaveState(message) {
            const state = document.getElementById('save-state');
            if (state) state.textContent = message;
        }

        function loadSchedule() {
            return scheduleCache;
        }

        function saveSchedule(schedule) {
            scheduleCache = normalizeSchedule(schedule);
            persistLocalSchedule(scheduleCache);
            setSaveState(`Saved locally ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
            queueRemoteSave(scheduleCache);
        }

        function queueRemoteSave(schedule) {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => saveRemoteSchedule(schedule), 500);
        }

        async function saveRemoteSchedule(schedule) {
            const token = getAuthToken();
            if (!token) {
                setSaveState('Saved in this browser. Sign in to sync.');
                return;
            }
            try {
                const res = await fetch(`${apiBase}/api/activity-arrangement`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify(normalizeSchedule(schedule))
                });
                if (!res.ok) throw new Error('Save failed');
                scheduleCache = normalizeSchedule(await res.json());
                persistLocalSchedule(scheduleCache);
                setSaveState(`Synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
            } catch (err) {
                console.error(err);
                setSaveState('Saved locally. Sync failed.');
            }
        }

        async function loadRemoteSchedule() {
            const token = getAuthToken();
            if (!token) {
                setSaveState('Saved in this browser. Sign in to sync.');
                return;
            }
            try {
                const localSchedule = readLocalSchedule();
                const res = await fetch(`${apiBase}/api/activity-arrangement`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Load failed');
                const remoteSchedule = normalizeSchedule(await res.json());
                const mergedSchedule = mergeSchedules(remoteSchedule, localSchedule);
                scheduleCache = mergedSchedule;
                persistLocalSchedule(scheduleCache);
                renderSchedule();
                updateMap();
                setSaveState(remoteSchedule.updatedAt ? 'Synced from server.' : 'Ready.');
                if (hasScheduleEntries(localSchedule) && JSON.stringify(mergedSchedule) !== JSON.stringify(remoteSchedule)) {
                    await saveRemoteSchedule(mergedSchedule);
                }
            } catch (err) {
                console.error(err);
                setSaveState('Using local copy. Sync unavailable.');
            }
        }

        function getMonday(date) {
            const copy = new Date(date);
            const day = copy.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            copy.setDate(copy.getDate() + diff);
            return copy.toISOString().slice(0, 10);
        }

        function addDays(dateString, days) {
            const date = new Date(`${dateString}T00:00:00`);
            date.setDate(date.getDate() + days);
            return date.toISOString().slice(0, 10);
        }

        function getVisibleWeeks() {
            const firstWeek = getMonday(new Date());
            const firstVisible = addDays(firstWeek, pageOffset * weeksPerPage * 7);
            return Array.from({ length: weeksPerPage }, (_, index) => addDays(firstVisible, index * 7));
        }

        function formatWeekLabel(dateString) {
            const date = new Date(`${dateString}T00:00:00`);
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatActivityDateLabel(text, weekStart) {
            const explicitDate = parseEntryDate(text, weekStart);
            if (explicitDate) return formatWeekLabel(explicitDate);
            return `${formatWeekLabel(weekStart)} - ${formatWeekLabel(addDays(weekStart, 6))}`;
        }

        function getCompanyName(text) {
            return (text || '').split('\n').map((line) => line.trim()).find(Boolean) || '';
        }

        function getStateName(abbr) {
            return stateShapes.find((shape) => shape.abbr === abbr)?.name || abbr;
        }

        function appendCell(row, text, tagName = 'td') {
            const cell = document.createElement(tagName);
            if (text instanceof Node) {
                cell.appendChild(text);
            } else {
                cell.textContent = text || '-';
            }
            row.appendChild(cell);
            return cell;
        }

        function createActiveInput(value, label, onInput, onCommit) {
            const input = document.createElement('input');
            input.className = 'active-field';
            input.type = 'text';
            input.value = value || '';
            input.setAttribute('aria-label', label);
            input.addEventListener('input', () => onInput(input.value));
            input.addEventListener('change', onCommit);
            return input;
        }

        function createActiveTable(headers, rows) {
            const table = document.createElement('table');
            table.className = 'active-table';
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headers.forEach((header) => appendCell(headerRow, header, 'th'));
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            rows.forEach((rowValues) => {
                const row = document.createElement('tr');
                rowValues.forEach((value) => appendCell(row, value));
                tbody.appendChild(row);
            });
            table.appendChild(tbody);
            return table;
        }

        function renderActiveLocations(activeByState) {
            const activeLocations = document.getElementById('active-locations');
            activeLocations.innerHTML = '';
            activeLocations.classList.toggle('is-empty', !activeByState.size);
            if (!activeByState.size) {
                activeLocations.textContent = 'No active future/current US locations logged yet.';
                return;
            }

            const entries = [...activeByState.entries()]
                .flatMap(([state, stateEntries]) => stateEntries.map((entry) => ({ ...entry, state })))
                .sort((a, b) => b.dateSort.localeCompare(a.dateSort) || a.person.localeCompare(b.person) || a.state.localeCompare(b.state));

            const saveActiveValue = (entry, field, value) => {
                const latest = loadSchedule();
                if (!latest[field] || typeof latest[field] !== 'object') latest[field] = {};
                latest[field][entry.key] = value;
                saveSchedule(latest);
            };
            const refreshActiveTables = () => updateMap();

            const detailRows = entries.map((entry) => [
                entry.dateLabel,
                entry.person,
                `${entry.state} - ${entry.location}`,
                createActiveInput(entry.company, `Company for ${entry.person} ${entry.dateLabel}`, (value) => saveActiveValue(entry, 'companies', value), refreshActiveTables)
            ]);

            const companyLocationRows = entries.map((entry) => [
                createActiveInput(entry.company, `Company for ${entry.person} ${entry.dateLabel}`, (value) => saveActiveValue(entry, 'companies', value), refreshActiveTables),
                createActiveInput(entry.location, `Company location for ${entry.person} ${entry.dateLabel}`, (value) => saveActiveValue(entry, 'companyLocations', value), refreshActiveTables)
            ]);

            const detailsPanel = document.createElement('div');
            detailsPanel.className = 'active-panel';
            const detailsTitle = document.createElement('div');
            detailsTitle.className = 'active-panel-title';
            detailsTitle.textContent = 'Active Logs';
            detailsPanel.appendChild(detailsTitle);
            detailsPanel.appendChild(createActiveTable(['Time', 'Person', 'Location', 'Company'], detailRows));

            const companyPanel = document.createElement('div');
            companyPanel.className = 'active-panel';
            const companyTitle = document.createElement('div');
            companyTitle.className = 'active-panel-title';
            companyTitle.textContent = 'Company Locations';
            companyPanel.appendChild(companyTitle);
            companyPanel.appendChild(createActiveTable(['Company', 'Location'], companyLocationRows));

            activeLocations.appendChild(detailsPanel);
            activeLocations.appendChild(companyPanel);
        }

        function moveStateTooltip(event) {
            const tooltip = document.getElementById('state-tooltip');
            if (!tooltip || tooltip.style.display === 'none') return;
            const rect = tooltip.getBoundingClientRect();
            const left = Math.min(event.clientX + 14, window.innerWidth - rect.width - 12);
            const top = Math.min(event.clientY + 14, window.innerHeight - rect.height - 12);
            tooltip.style.left = `${Math.max(12, left)}px`;
            tooltip.style.top = `${Math.max(12, top)}px`;
        }

        function hideStateTooltip() {
            const tooltip = document.getElementById('state-tooltip');
            if (tooltip) tooltip.style.display = 'none';
        }

        function showStateTooltip(event, state) {
            const entries = activeTooltipEntries.get(state) || [];
            const tooltip = document.getElementById('state-tooltip');
            if (!tooltip || !entries.length) {
                hideStateTooltip();
                return;
            }
            const stateName = stateShapes.find((shape) => shape.abbr === state)?.name || state;
            tooltip.innerHTML = '';

            const title = document.createElement('div');
            title.className = 'state-tooltip-title';
            title.textContent = `${stateName} (${state})`;
            tooltip.appendChild(title);

            entries
                .slice()
                .sort((a, b) => a.person.localeCompare(b.person) || a.dateLabel.localeCompare(b.dateLabel))
                .forEach((entry) => {
                    const row = document.createElement('div');
                    row.className = 'state-tooltip-entry';

                    const person = document.createElement('div');
                    person.className = 'state-tooltip-person';
                    person.textContent = entry.person;
                    row.appendChild(person);

                    const date = document.createElement('div');
                    date.className = 'state-tooltip-date';
                    date.textContent = entry.dateLabel;
                    row.appendChild(date);

                    if (entry.note) {
                        const note = document.createElement('div');
                        note.className = 'state-tooltip-note';
                        note.textContent = entry.note;
                        row.appendChild(note);
                    }

                    tooltip.appendChild(row);
                });

            tooltip.style.display = 'block';
            moveStateTooltip(event);
        }

        function renderSchedule() {
            const schedule = loadSchedule();
            const visibleWeeks = getVisibleWeeks();
            const header = document.getElementById('week-header');
            const body = document.getElementById('schedule-body');
            const range = document.getElementById('week-range');

            header.innerHTML = '<th class="person-header">Name</th>';
            body.innerHTML = '';
            range.textContent = `${formatWeekLabel(visibleWeeks[0])} - ${formatWeekLabel(visibleWeeks[visibleWeeks.length - 1])}`;

            visibleWeeks.forEach((weekStart) => {
                const th = document.createElement('th');
                th.innerHTML = `<span class="week-label">${formatWeekLabel(weekStart)}</span><span class="week-subtitle">Week start</span>`;
                header.appendChild(th);
            });

            people.forEach((person) => {
                const tr = document.createElement('tr');
                const nameCell = document.createElement('td');
                nameCell.className = 'person-cell';
                nameCell.textContent = person;
                tr.appendChild(nameCell);

                visibleWeeks.forEach((weekStart) => {
                    const td = document.createElement('td');
                    td.className = 'schedule-cell';
                    const textarea = document.createElement('textarea');
                    const stateSelect = document.createElement('select');
                    const key = `${person}__${weekStart}`;
                    stateSelect.className = 'cell-location';
                    stateSelect.innerHTML = '<option value="">State</option>' + stateOptions
                        .map(([abbr, name]) => `<option value="${abbr}">${abbr} - ${name}</option>`)
                        .join('');
                    stateSelect.value = schedule.states[key] || '';
                    stateSelect.addEventListener('change', () => {
                        const latest = loadSchedule();
                        latest.states[key] = stateSelect.value;
                        saveSchedule(latest);
                        updateMap();
                    });
                    textarea.className = 'cell-editor';
                    textarea.placeholder = '';
                    textarea.value = schedule.cells[key] || '';
                    textarea.addEventListener('input', () => {
                        const latest = loadSchedule();
                        latest.cells[key] = textarea.value;
                        saveSchedule(latest);
                        updateMap();
                    });
                    td.appendChild(stateSelect);
                    td.appendChild(textarea);
                    tr.appendChild(td);
                });

                body.appendChild(tr);
            });
        }

        function initStateMap() {
            const map = document.getElementById('state-map');
            map.innerHTML = '';
            stateShapes.forEach((shape) => {
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.dataset.state = shape.abbr;
                group.setAttribute('class', 'state-group');
                group.addEventListener('mousemove', (event) => showStateTooltip(event, shape.abbr));
                group.addEventListener('mouseleave', hideStateTooltip);

                let region;
                if (shape.type === 'polygon') {
                    region = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    region.setAttribute('points', shape.points.map(([x, y]) => `${x},${y}`).join(' '));
                } else {
                    region = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    region.setAttribute('cx', shape.cx);
                    region.setAttribute('cy', shape.cy);
                    region.setAttribute('r', shape.r);
                }
                region.setAttribute('class', 'state-marker');

                const labelPosition = stateLabelOverrides[shape.abbr] || shape.label;
                if (stateLabelOverrides[shape.abbr]) {
                    const callout = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    callout.setAttribute('class', 'state-callout');
                    callout.setAttribute('x1', shape.label[0]);
                    callout.setAttribute('y1', shape.label[1]);
                    callout.setAttribute('x2', labelPosition[0] - 10);
                    callout.setAttribute('y2', labelPosition[1]);
                    group.appendChild(callout);
                }

                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('class', 'state-label');
                label.setAttribute('x', labelPosition[0]);
                label.setAttribute('y', labelPosition[1]);
                label.textContent = shape.abbr;

                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = shape.name;

                group.appendChild(region);
                group.appendChild(label);
                group.appendChild(title);
                map.appendChild(group);
            });

            const legend = document.getElementById('map-legend');
            legend.innerHTML = people.map((person, index) => `
                <span class="legend-item"><span class="legend-swatch" style="background:${personColors[index % personColors.length]}"></span>${person}</span>
            `).join('') + '<span class="legend-item"><span class="legend-swatch" style="background:#111827"></span>Multiple people</span>';
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
        }

        function findStates(text) {
            const normalized = normalizeText(text);
            const found = new Set();
            Object.entries(stateAliases).forEach(([alias, abbr]) => {
                if (alias.length === 2) {
                    const abbreviationPattern = new RegExp(`(^|[^A-Za-z])${alias.toUpperCase()}([^A-Za-z]|$)`);
                    if (abbreviationPattern.test(text)) found.add(abbr);
                } else if (normalized.includes(alias)) {
                    found.add(abbr);
                }
            });
            if (/Washington\s*,?\s*DC\b/.test(text)) {
                found.delete('WA');
                found.add('DC');
            }
            return [...found];
        }

        function parseEntryDate(text, weekStart) {
            const ymd = text.match(/\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);
            if (ymd) return `${ymd[1]}-${ymd[2].padStart(2, '0')}-${ymd[3].padStart(2, '0')}`;
            const mdy = text.match(/\b(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2})\b/);
            if (mdy) return `${mdy[3]}-${mdy[1].padStart(2, '0')}-${mdy[2].padStart(2, '0')}`;
            const shortMdy = text.match(/\b(\d{1,2})[-/.](\d{1,2})\b/);
            if (shortMdy) {
                const year = new Date(`${weekStart}T00:00:00`).getFullYear();
                return `${year}-${shortMdy[1].padStart(2, '0')}-${shortMdy[2].padStart(2, '0')}`;
            }
            const monthDate = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:,?\s*(20\d{2}))?\b/i);
            if (monthDate) {
                const monthMap = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
                const monthKey = monthDate[1].toLowerCase().startsWith('sept') ? 'sept' : monthDate[1].toLowerCase().slice(0, 3);
                const month = monthMap[monthKey];
                const year = monthDate[3] || new Date(`${weekStart}T00:00:00`).getFullYear();
                return `${year}-${String(month).padStart(2, '0')}-${monthDate[2].padStart(2, '0')}`;
            }
            return null;
        }

        function isCurrentOrFuture(dateString) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const date = new Date(`${dateString}T00:00:00`);
            return date >= today;
        }

        function updateMap() {
            const schedule = loadSchedule();
            const activeByState = new Map();
            const scheduledKeys = new Set([
                ...Object.keys(schedule.cells || {}),
                ...Object.keys(schedule.states || {})
            ]);
            scheduledKeys.forEach((key) => {
                const text = schedule.cells[key] || '';
                const selectedState = schedule.states[key] || '';
                if (!text.trim() && !selectedState) return;
                const separatorIndex = key.lastIndexOf('__');
                if (separatorIndex === -1) return;
                const person = key.slice(0, separatorIndex);
                const weekStart = key.slice(separatorIndex + 2);
                const activeUntil = parseEntryDate(text, weekStart) || addDays(weekStart, 6);
                if (!isCurrentOrFuture(activeUntil)) return;
                const matchedStates = new Set(findStates(text));
                if (selectedState) matchedStates.add(selectedState);
                matchedStates.forEach((state) => {
                    const entry = {
                        key,
                        person,
                        dateSort: weekStart,
                        dateLabel: formatActivityDateLabel(text, weekStart),
                        location: schedule.companyLocations[key] || '',
                        stateLocation: getStateName(state),
                        company: schedule.companies[key] || '',
                        note: text.trim()
                    };
                    if (!activeByState.has(state)) activeByState.set(state, []);
                    activeByState.get(state).push(entry);
                });
            });

            activeTooltipEntries = activeByState;

            document.querySelectorAll('.state-group').forEach((group) => {
                const entriesForState = activeByState.get(group.dataset.state) || [];
                const peopleForState = new Set(entriesForState.map((entry) => entry.person));
                const hasActivity = entriesForState.length > 0;
                const marker = group.querySelector('.state-marker');
                const label = group.querySelector('.state-label');
                const title = group.querySelector('title');
                group.classList.toggle('has-activity', hasActivity);
                marker.classList.toggle('is-active', hasActivity);
                marker.classList.toggle('is-multi', peopleForState.size > 1);
                label.classList.toggle('is-active', hasActivity);
                marker.style.fill = '';
                const stateName = stateShapes.find((shape) => shape.abbr === group.dataset.state)?.name || group.dataset.state;
                title.textContent = stateName;
                if (hasActivity && peopleForState.size === 1) {
                    const person = [...peopleForState][0];
                    marker.style.fill = personColors[people.indexOf(person) % personColors.length];
                    title.textContent += ` - ${person}`;
                } else if (peopleForState.size > 1) {
                    title.textContent += ` - ${[...peopleForState].join(', ')}`;
                }
            });

            renderActiveLocations(activeByState);
        }
        document.getElementById('prev-weeks').addEventListener('click', () => {
            pageOffset -= 1;
            sessionStorage.setItem('activity_arrangement_page_offset', String(pageOffset));
            renderSchedule();
            updateMap();
        });

        document.getElementById('next-weeks').addEventListener('click', () => {
            pageOffset += 1;
            sessionStorage.setItem('activity_arrangement_page_offset', String(pageOffset));
            renderSchedule();
            updateMap();
        });

        document.getElementById('clear-schedule').addEventListener('click', () => {
            if (!confirm('Clear all activity arrangement entries for everyone?')) return;
            saveSchedule({ cells: {}, states: {}, companies: {}, companyLocations: {} });
            setSaveState('Table cleared.');
            renderSchedule();
            updateMap();
        });

        initStateMap();
        renderSchedule();
        updateMap();
        loadRemoteSchedule();
    </script>
</body>

</html>
